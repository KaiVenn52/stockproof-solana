name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # scripts/verify-rendered.mjs needs a browser, and scripts/validate-live.mjs
      # needs live issuer and Solana endpoints. Neither belongs in CI: run
      # `npm run live:verify` and `npm run verify:rendered` locally before shipping.
